version: 2
# 依赖更新：只提 PR，不自动合并
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router-dom"]
      tooling:
        patterns: ["vite*", "@vitejs/*", "typescript", "prettier", "tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
