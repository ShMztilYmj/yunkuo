version: 2
# 依赖更新：只提 PR，不自动合并。
# 每个 PR 都会跑一遍 Windows 上的完整 CI（约 10 分钟），所以限额保持很低，
# 分组后同类依赖合并成一个 PR，避免一次堆出十几个红叉。
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router-dom"]
      tooling:
        patterns: ["vite*", "@vitejs/*", "typescript", "prettier", "tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
