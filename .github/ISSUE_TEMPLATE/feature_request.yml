name: 功能建议
description: 提出新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是直接给方案
      placeholder: 每次切换订阅后需要手动重开 TUN，希望…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 代理 / 内核 / TUN
        - 指纹浏览器
        - AI 工具与用量
        - 系统检测与修复
        - 设置与界面
        - 构建与发布
    validations:
      required: true
