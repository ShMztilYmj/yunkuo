name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（脚本契约 · 类型检查 · 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:scripts
      - run: npx prettier --check "src/**/*.{ts,tsx,css}" "scripts/**/*.mjs"
      - run: pnpm run test:frontend
      - run: pnpm run typecheck
      - run: pnpm run build

  rust:
    name: 后端（cargo test）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # 格式检查不需要编译，先跑，失败最快。
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: pnpm install --frozen-lockfile
      # 编译前置条件之一：tauri-build 在编译期逐个校验 externalBin 与 resources 的路径，
      # mihomo 内核、指纹浏览器目录、规则库缺任何一项都会让 clippy/test 直接 panic。
      # 以 vendor.lock.json 为缓存键：锁文件不变时命中缓存，只补下当时缺失的那几项。
      - uses: actions/cache@v6
        with:
          path: |
            src-tauri/resources/fingerprint-chromium
            src-tauri/resources/geodata
            src-tauri/resources/tokscale
          key: vendor-${{ hashFiles('scripts/vendor.lock.json') }}
      - run: pnpm fetch:vendor --with-browser
      # 编译前置条件之二：frontendDist（dist）与 build.rs 读取的服务侧车哈希。
      - run: pnpm run build
      - run: pnpm run service:prepare
      # 只拦正确性问题；既有 160 余条风格告警保持不阻塞，清理后再收紧到 -D warnings。
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::correctness
      # 串行执行；失败项由 scripts/test-rust.mjs 单独重试一次，区分干扰与真实失败。
      - run: pnpm test
