name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（脚本契约 · 类型检查 · 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:scripts
      - run: npx prettier --check "src/**/*.{ts,tsx,css}" "scripts/**/*.mjs"
      - run: pnpm run test:frontend
      - run: pnpm run typecheck
      - run: pnpm run build

  rust:
    name: 后端（cargo test）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # 格式与 clippy 不依赖前端产物，放在构建之前先失败。
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # 只拦正确性问题；既有 163 条风格告警保持不阻塞，清理后再收紧到 -D warnings。
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::correctness
      - run: pnpm install --frozen-lockfile
      # tauri-build 会校验 frontendDist，build.rs 又依赖服务侧车的哈希，两者都必须先就位。
      - run: pnpm run build
      - run: pnpm run service:prepare
      # 串行执行；失败项由 scripts/test-rust.mjs 单独重试一次，区分干扰与真实失败。
      - run: pnpm test
