name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（脚本契约 · 类型检查 · 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:scripts
      - run: npx prettier --check "src/**/*.{ts,tsx,css}" "scripts/**/*.mjs"
      - run: pnpm run test:frontend
      - run: pnpm run typecheck
      - run: pnpm run build

  rust:
    name: 后端（cargo test）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # 格式检查不需要编译，先跑，失败最快。
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: pnpm install --frozen-lockfile
      # 编译前置条件：tauri-build 校验 frontendDist（dist），build.rs 读取服务侧车哈希
      # （src-tauri/binaries/yunkuo-service-*.exe）。两者缺一，clippy 与 cargo test 都会
      # 在编译期直接 panic，所以必须在任何 cargo 构建之前生成。
      - run: pnpm run build
      - run: pnpm run service:prepare
      # 只拦正确性问题；既有 160 余条风格告警保持不阻塞，清理后再收紧到 -D warnings。
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::correctness
      # 串行执行；失败项由 scripts/test-rust.mjs 单独重试一次，区分干扰与真实失败。
      - run: pnpm test
