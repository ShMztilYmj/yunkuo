<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>托盘首次打开测试</title>
  </head>
  <body>
    <div id="fixture"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
      import { emit } from "@tauri-apps/api/event";
      import TrayMenu from "/src/app/windows/TrayMenu.tsx";
      import { useAppStore } from "/src/store.ts";

      const calls = [];
      const subscribed = [];
      let readyBeforeListeners = false;
      mockIPC(
        async (command) => {
          calls.push(command);
          if (command === "get_config")
            return { mode: "rule", network_mode: null };
          if (command === "core_status")
            return { running: true, system_proxy: false, tun: false };
          if (command === "ai_monitor_status") return null;
          if (command === "plugin:app|version") return "0.2.14";
          if (command === "tray_ready") {
            readyBeforeListeners ||= subscribed.length < 4;
            // 模拟真实冷启动：原生 ready 立即触发首次打开事件。
            await emit("tray-visibility", true);
            await emit("tray-opened");
          }
          return null;
        },
        { shouldMockEvents: true },
      );
      mockWindows("tray-menu");
      const originalInvoke = window.__TAURI_INTERNALS__.invoke;
      window.__TAURI_INTERNALS__.invoke = async (command, args, options) => {
        if (command === "plugin:event|listen") {
          await new Promise((resolve) => setTimeout(resolve, 30));
          const result = await originalInvoke(command, args, options);
          subscribed.push(args.event);
          return result;
        }
        return originalInvoke(command, args, options);
      };
      useAppStore.setState({ windowVisible: false });
      window.fixture = {
        emit,
        calls,
        visible() {
          return useAppStore.getState().windowVisible;
        },
        readyBeforeListeners() {
          return readyBeforeListeners;
        },
      };
      createRoot(document.getElementById("fixture")).render(
        React.createElement(TrayMenu),
      );
    </script>
  </body>
</html>
